<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- original icon: red cricket ball with a stitched seam on a navy tile -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13305e"/><stop offset="1" stop-color="#0b1a33"/></linearGradient>
    <radialGradient id="ball" cx=".36" cy=".32" r=".75"><stop offset="0" stop-color="#f0475b"/><stop offset=".55" stop-color="#b3132a"/><stop offset="1" stop-color="#6e0a17"/></radialGradient>
    <clipPath id="c"><circle cx="32" cy="32" r="21"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <circle cx="32" cy="32" r="21" fill="url(#ball)"/>
  <g clip-path="url(#c)" fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M13 44 Q32 34 51 20" stroke-width="1.7"/>
    <path d="M13 50 Q34 39 55 24" stroke-width="1.7"/>
